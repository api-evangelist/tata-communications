notes: >-
  Tata Communications publishes no versioning policy, no deprecation policy, no SLA
  document, and no status page for its APIs. What it does expose is the Akana Community
  Manager version model — every API is a named version with an environment, a lifecycle
  state, and created/updated timestamps — which is recorded here because it is the only
  lifecycle signal a developer can actually read anonymously.
