  docs: https://developer.tatacommunications.com/apis
  note: >-
    Each API on the Akana portal carries a single version named "1.0" in state
    com.soa.api.state.open, environment "Production". Version is not expressed in a URI
    path or a header in any published specification — no host or basePath is declared at
    all, so the versioning surface of the running API cannot be observed anonymously.
