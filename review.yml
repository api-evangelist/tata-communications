  openapi:
    downloadable: true
    count: 3
    format: Swagger 2.0 (OAS3 / OAS31 renderings also advertised by the same endpoint)
    catalogueListed: 49
    catalogueAnonymouslyAccessible: 3
    catalogueGated: 46
    fetchDate: '2026-07-25'
    specs:
    - file: openapi/tata-communications-number-intelligence-api.json
      title: Number Intelligence API
      version: '1.0'
      sourceURL: https://developer.tatacommunications.com/api/apis/versions/9c14d794-576f-4d76-a930-7ba00f38c714.tcl/design?specification=swagger2
      httpStatus: 200
      paths: 2
      operations: 2
      swagger: '2.0'
    - file: openapi/tata-communications-mobile-messaging-exchange-account-administration.json
      title: Mobile Messaging Exchange - Account Administration
      version: '1.0'
      sourceURL: https://developer.tatacommunications.com/api/apis/versions/976eb113-e9b9-4af7-8e54-842fde470bb1.tcl/design?specification=swagger2
      httpStatus: 200
      paths: 3
      operations: 3
      swagger: '2.0'
    - file: openapi/tata-communications-mobile-messaging-exchange-cdr-report-api.json
      title: Mobile Messaging Exchange - CDR Report API
      version: '1.0'
      sourceURL: https://developer.tatacommunications.com/api/apis/versions/70989384-2a73-44d3-8925-8ca108c061b0.tcl/design?specification=swagger2
      httpStatus: 200
      paths: 2
      operations: 2
      swagger: '2.0'
    note: >-
      No host, basePath, or schemes are declared in any of the three harvested
      documents, so no production base URL is documented anonymously. No
      securityDefinitions block is present either; the Number Intelligence
      document instead carries a required "Authorization" header parameter
      described as "used for authentication in Akana".
  camara:
    posture: >-
      No CAMARA reference found — not an implementation, not a channel, not even
      a press release. Tata Communications is a wholesale carrier rather than a
      mobile network operator, and the November 2025 GSMA Open Gateway MoU
      belongs to Tata Elxsi, a different Tata Group company.
    apis: []
    openGatewayMember: false
    adunaChannel: false
    cpaasChannel: >-
      Its own CPaaS reaches developers through the separately branded Kaleyra
      portal (developers.kaleyra.io), acquired October 2023.
    pressReleaseOnly: false
    adjacentPreCamaraCapabilities:
    - Number Intelligence API (E.164 lookup, portability dip indicator, MCC/MNC) — first-party, public, Swagger harvested
    - DIGO "Mobile Connect" (legacy GSMA identity scheme) — product page only
    - DIGO "One Tap Authentication" (Initiate / Verify) — HTML docs only
    - DIGO "HLR Lookup" — product page only
    - DIGO "Verified Calls" / "Verified SMS" — product page only
    evidenceNote: >-
      Do not attribute Tata Elxsi's GSMA Fusion MoU, TETHER platform, or QoD
      use-case work to Tata Communications. They are separate Tata Group
      companies.
  tmforum:
    conformanceCertified: false
    apisFound: []
    note: No TM Forum Open API conformance certification could be evidenced from public sources.
  threeGPP:
    nef: false
    scef: false
    networkSlicingAPI: false
    edgeMecAPI: false
    note: >-
      Private 5G and MVNE are marketed under MOVE and network-provisioning APIs
      appear by name in the gated portal catalogue, but no 3GPP exposure function
      is published.
  auth:
    schemes:
    - name: Opaque Authorization header
      where: developer.tatacommunications.com (Akana Community Manager)
      evidence: >-
        Required "Authorization" header parameter in the Number Intelligence
        Swagger, documented as "used for authentication in Akana". No
        securityDefinitions block is present in any harvested document.
    - name: OAuth 2.0 bearer token
      where: Tata Communications MOVE (Azure API Management)
      evidence: >-
        "Move Access Token API — API to generate Access Token (OAuth 2.0 bearer
        token) to access Move APIs", published on the MOVE portal home page.
    - name: Auth token issued on request
      where: Tata Communications DIGO
      evidence: >-
        "You will need auth token to access our APIs. Please fill in your details
        below and we will get in touch with you."
    ciba: false
    cibaNote: >-
      CIBA (Client-Initiated Backchannel Authentication) does not appear anywhere.
      This follows from the CAMARA absence — there is no network-based
      authorization surface to back it.
    wellKnown:
      openidConfiguration: 404
      oauthAuthorizationServer: 404
  webhooks:
    firstPartyEventCatalogPublished: false
    evidence:
    - >-
      "Horizontal Webhook API" appears by name in the gated portal catalogue but
      returns 401 anonymously.
    - >-
      DIGO documents "Webhook Payload" for WhatsApp and "DLR Call back Report" /
      "Tiny URL Call back Report" for Engage, in HTML only.
    asyncapi: false
