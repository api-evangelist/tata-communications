    httpStatus: 200
    platform: Akana Community Manager (atmosphere / hermosa theme)
    real: true
    loginWall: partial
    note: >-
      A real portal with a machine-readable catalogue, but only 3 of the 49 APIs
      it lists are anonymously accessible. No anonymous sign-up path is exposed.
  secondaryPortals:
