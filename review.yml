aid: tata-communications
name: Tata Communications
review:
  question: >-
    Does Tata Communications operate a real, self-serve public developer portal
    with downloadable API definitions, and what is its CAMARA / GSMA Open Gateway
    posture?
  answer: partial
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: India
  tier: wholesale-messaging
  gated: true
findings:
  summary: |
    Tata Communications is a wholesale carrier and digital-infrastructure
    provider, not a mobile network operator and not a CPaaS-style aggregator.
    Its developer surface reflects that: a real first-party API portal exists and
    is genuinely machine-readable, but almost all of it is closed to anonymous
    callers, and the parts of the business that developers actually integrate
    with (CPaaS) reach the market under the separately branded Kaleyra portal.

    The first-party portal at https://developer.tatacommunications.com (HTTP 200)
    is an Akana Community Manager instance. Its public HTML catalogue at /apis
    names 49 APIs. Its JSON catalogue at /api/apis returns only 3 of those 49
    with visibility "Public"; anonymous GETs against the other 46 API records
    return HTTP 401. So the portal is a real portal — not a marketing page — but
    it is 94% partner-gated. There is no anonymous sign-up path exposed; even the
    tenant configuration endpoint (/api/tenants/tcl) answers 401.

    The three Public APIs each expose a genuine, parseable Swagger 2.0 document
    over an anonymous GET, and the same endpoint advertises OAS3 and OAS31
    variants in its Links block (the swagger2 rendering is the richer of the two —
    the oas3 conversion drops summaries and tags — so swagger2 was harvested
    verbatim). All three specs are Mobile Messaging Exchange / number-lookup
    wholesale APIs, which is exactly where a carrier's carrier sells.

    Tata Communications MOVE (global IoT / eSIM / MVNE) runs a SECOND and
    entirely separate developer portal on Azure API Management at
    https://move-external-apim-prod.developer.azure-api.net (HTTP 200). Its home
    page publicly names three API products — MOVE SIM Connect API, MOVE IOT
    Connect API, and Move Access Token API — but the catalogue behind it is
    gated: anonymous calls to the APIM management endpoint
    (move-external-apim-prod.management.azure-api.net/.../apis?api-version=2022-04-01-preview)
    and to each per-API export return HTTP 401. Sign in / Sign up links are
    present, so self-serve registration may exist behind the wall, but nothing
    machine-readable is reachable without an account.

    The DIGO CPaaS property (tatacommunicationsdigo.io) is a WordPress site whose
    "Documentation and APIs" index does publish a faithful product breakdown
    (Programmable Voice US/India, Email, Authenticate MFA, One Tap
    Authentication, WhatsApp, Number Management, SMS, Anonymize, Engage) and
    whose per-product pages use a WordPress template literally named
    "swaggerapidetails" — but no OpenAPI/Swagger document is downloadable and the
    page bodies render no endpoints server-side. Access is explicitly sales-led:
    "You will need auth token to access our APIs. Please fill in your details
    below and we will get in touch with you." Two degradations were observed and
    are recorded because they are real: the site's TLS certificate
    (CN=tatacommunicationsdigo.io, issued by Thawte TLS RSA CA G1) expired on
    2026-07-23, two days before this review, so the docs are unreachable over
    HTTPS without disabling certificate validation; and the console host
    console-ssp.tatacommunicationsdigo.io does not resolve in DNS. Placeholder
    "Lorem ipsum" copy is still live in the Services menu.

    The corporate marketing page https://www.tatacommunications.com/api-zone
    (HTTP 200) is the "API Zone" pitch — "our easy to use REST APIs are available
    to developers through our purpose-built API Zone" — and its "API Reference"
    call to action links to https://docs.tclaws.co/, which does not resolve
    (NXDOMAIN on both tclaws.co and docs.tclaws.co). The only other artefact the
    page offers is a PDF brochure. That dead reference link is the single
    clearest signal of the gap between the stated API posture and the shipped one.

    CAMARA posture: no CAMARA reference of any kind was found on
    tatacommunications.com, on developer.tatacommunications.com, on the MOVE
    portal, or on the DIGO property. Tata Communications is not a mobile network
    operator and no GSMA Open Gateway participation could be evidenced. The GSMA
    Open Gateway / CAMARA memorandum of understanding widely reported in November
    2025 belongs to TATA ELXSI — a different Tata Group company (design and
    engineering services, TETHER platform) — and must not be attributed to Tata
    Communications. There is not even a press release here: this is an absence,
    not an announcement. The closest adjacent capabilities in the portfolio are
    pre-CAMARA and carrier-native rather than CAMARA-shaped: the Number
    Intelligence API (E.164 lookup, portability dip, MCC/MNC) on the first-party
    portal, and DIGO's "Mobile Connect" (the older GSMA identity scheme), "One Tap
    Authentication", "HLR Lookup", and "Verified Calls / Verified SMS" product
    entries. None of these are CAMARA Number Verification, SIM Swap, Device
    Location, Device Status, Quality on Demand, Carrier Billing, KYC Match, Scam
    Signal, Device Swap, or Population Density implementations.

    TM Forum: no TM Forum Open API conformance certification (TMF620, TMF622,
    TMF641 or any other) could be evidenced for Tata Communications from public
    sources during this review.

    3GPP exposure: no NEF (Network Exposure Function) or SCEF surface is
    published. Tata Communications does market Private 5G and MVNE services under
    MOVE, and its gated portal catalogue names network-provisioning APIs
    (Network service provisioning - Access SREVPN, Threadspan Network Automation
    API, GNS IWAN/GVPN/NDE APIs), but none are anonymously reachable and none are
    described as 3GPP exposure functions.

    SDKs and source: the GitHub organisations github.com/tatacommunications and
    github.com/tata-communications both exist and both have 0 public
    repositories. No first-party SDK was found on npm. No public Postman
    workspace, no GraphQL endpoint, no published .proto, and no AsyncAPI were
    found.

    Channel to developers: in practice Tata Communications' CPaaS business
    reaches developers through Kaleyra (acquired October 2023), whose docs at
    developers.kaleyra.io are a real self-serve ReadMe-hosted developer portal —
    and which carry zero "Tata" branding in their page source. Kaleyra is
    profiled separately in this network. That split is the finding: the carrier
    sells wholesale through a gated Akana portal, and the developer-facing
    product ships under an acquired brand.
