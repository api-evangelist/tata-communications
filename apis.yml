- aid: tata-communications:tata-communications-move-sim-connect-api
  name: MOVE SIM Connect API
  description: >-
    Full-service API for the Tata Communications MOVE platform SIM Connect
    product, supporting management of a tenancy — its key entities, services, and
    the products the tenancy avails. Published on the separate MOVE developer
    portal hosted on Azure API Management; the API reference and any machine-
    readable definition require portal sign-in, and anonymous calls to the
    catalogue endpoint return 401.
