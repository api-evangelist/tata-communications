apis:
- aid: tata-communications:tata-communications-number-intelligence-api
  name: Number Intelligence API
  description: >-
    Queries the number-lookup details of any E.164 number and returns subscriber
    type, the current and parent network, the port-corrected service provider
    network (SPN), and MCC/MNC when the number is mobile, so a sender can decide
    whether to route traffic to a fixed or mobile destination. Publicly visible
    on the Tata Communications developer portal with a downloadable Swagger 2.0
    document; 2 operations across 2 paths.
  humanURL: https://developer.tatacommunications.com/#/api/0cd4be86-167c-4770-9459-e68fe925f63a.tcl
  tags:
  - Number Intelligence
  - Number Portability
  - Routing
  - Wholesale
  properties:
