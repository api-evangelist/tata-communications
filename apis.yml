name: Tata Communications
kind: company
description: >-
  Tata Communications is the global wholesale carrier and digital-infrastructure
  arm of India's Tata Group, headquartered in Mumbai. It owns one of the world's
  largest subsea cable networks, carries a large share of global internet routes,
  and sells international voice and messaging wholesale, IZO network services,
  MOVE global IoT and eSIM connectivity, MVNE services, and — through its
  October 2023 acquisition of Kaleyra — a full CPaaS, UCaaS, and CCaaS stack.
  It sits in the supply layer of the telecom value chain: a carrier's carrier
  whose customers are mostly other operators, enterprises, and aggregators
  rather than individual developers. Its API posture matches that position and
  is honestly partner-gated. Tata Communications runs a real first-party
  developer portal at developer.tatacommunications.com, built on Akana Community
  Manager, whose catalogue names 49 APIs — but only three are marked Public and
  return a downloadable Swagger 2.0 document to an anonymous caller; the other
  forty-six answer 401. MOVE IoT has a second, separate Azure API Management
  portal that lists three API products but gates the reference behind sign-in.
  The DIGO CPaaS documentation site is HTML-only, sales-gated behind a
  "we will get in touch" form, and was serving an expired TLS certificate at the
  time of review. No CAMARA network API and no GSMA Open Gateway participation
  could be evidenced anywhere on its properties. In practice most developers
  reach Tata Communications through the separately branded Kaleyra CPaaS
  portal rather than through Tata Communications itself.
